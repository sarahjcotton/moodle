issueNumber: MDL-89289
notes:
  core:
    - message: >-
        Uninstalling a block plugin no longer deletes its instances synchronously.
        \core\plugininfo\block::uninstall_cleanup() now queues the new
        \core\task\delete_block_instances_task ad-hoc task, which deletes the
        instances and their related data (contexts, positions, user preferences
        and search index entries) in batches. This makes block removal upgrade
        steps and plugin uninstallation effectively instant on large sites.
        Remaining instances are not displayed anywhere once the block record has
        been deleted.
      type: changed
